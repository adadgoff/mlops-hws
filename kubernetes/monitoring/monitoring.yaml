# Мониторинг стек для MLOps системы
# Включает: VictoriaMetrics + Grafana + ServiceMonitor

---
# Namespace для мониторинга (если еще не создан)
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring

---
# Установка VictoriaMetrics через Helm (манифест генерируется отдельно)
# Для генерации использовать:
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm template victoriametrics prometheus-community/kube-prometheus-stack \
#   --namespace monitoring \
#   --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
#   > monitoring-stack.yaml
#
# Альтернативно, используем упрощенную установку VictoriaMetrics:

---
# VictoriaMetrics Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  namespace: monitoring
  labels:
    app: victoriametrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      containers:
        - name: victoriametrics
          image: victoriametrics/victoria-metrics:v1.95.0
          ports:
            - containerPort: 8428
              name: http
          args:
            - --storageDataPath=/storage
            - --retentionPeriod=1
            - --promscrape.config=/etc/prometheus/prometheus.yml
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: prometheus-config
              mountPath: /etc/prometheus
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8428
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: storage
          emptyDir: {}
        - name: prometheus-config
          configMap:
            name: victoriametrics-scrape-config

---
# VictoriaMetrics Service
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: monitoring
  labels:
    app: victoriametrics
spec:
  type: ClusterIP
  ports:
    - port: 8428
      targetPort: 8428
      name: http
  selector:
    app: victoriametrics

---
# ConfigMap для Prometheus scrape config (для VictoriaMetrics)
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-scrape-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # VictoriaMetrics self-scrape
      - job_name: 'victoriametrics'
        static_configs:
          - targets: ['localhost:8428']

      # ML Backend
      - job_name: 'ml-backend'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - mlops
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: backendrest
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      # ServiceMonitor scrape (для автоматического обнаружения)
      - job_name: 'servicemonitor'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            action: keep
            regex: backendrest

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin123"
            - name: GF_INSTALL_PLUGINS
              value: ""
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-config
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            limits:
              cpu: "500m"
              memory: "1Gi"
            requests:
              cpu: "250m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-config
          configMap:
            name: grafana-dashboards-config
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboard-ml

---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: grafana

---
# ConfigMap для Grafana datasources
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        url: http://victoriametrics:8428
        access: proxy
        isDefault: true
        editable: true
        uid: victoriametrics

---
# ConfigMap для Grafana dashboard provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'ML Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updatePeriodSeconds: 30
        options:
          path: /var/lib/grafana/dashboards

---
# NodePort сервис для доступа к Grafana извне
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: monitoring
  labels:
    app: grafana
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30040
      name: http
  selector:
    app: grafana

---
# NodePort сервис для доступа к VictoriaMetrics извне
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics-nodeport
  namespace: monitoring
  labels:
    app: victoriametrics
spec:
  type: NodePort
  ports:
    - port: 8428
      targetPort: 8428
      nodePort: 30041
      name: http
  selector:
    app: victoriametrics
