apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: object-store-operator-webhook
  annotations:
    aistor.min.io/authors: MinIO, Inc.
    aistor.min.io/license: Enterprise
    aistor.min.io/support: https://subnet.min.io
    aistor.min.io/version: RELEASE.2025-12-17T19-10-08Z
webhooks:
  - name: objectstore-rack-selector.min.io
    admissionReviewVersions: ["v1", "v1beta1"]
    sideEffects: "NoneOnDryRun"
    timeoutSeconds: 10
    failurePolicy: "Fail"
    reinvocationPolicy: "IfNeeded"
    matchPolicy: "Exact"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        operations: ["CREATE"]
        scope: "*"
    clientConfig:
      caBundle: ""
      service:
        name: object-store-webhook
        namespace: mlops
        path: /mutate
        port: 8443
    objectSelector:
      matchExpressions:
        - key: aistor.min.io/objectStore
          operator: Exists
        - key: v1.min.io/pool
          operator: Exists
