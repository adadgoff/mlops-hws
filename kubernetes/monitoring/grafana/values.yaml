replicaCount: 1

adminUser: admin
adminPassword: admin123

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        url: http://victoriametrics-server:8428
        access: proxy
        isDefault: true
        editable: true
        uid: victoriametrics

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updatePeriodSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    ml-backend-dashboard:
      url: https://raw.githubusercontent.com/mlops-hw1/main/kubernetes/monitoring/grafana/dashboards/ml-service-dashboard.json
      datasource: VictoriaMetrics