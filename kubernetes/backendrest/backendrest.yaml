apiVersion: apps/v1
kind: Deployment
metadata:
  name: backendrest
  namespace: mlops
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backendrest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backendrest
    spec:
      containers:
        - name: backendrest
          image: "backendrest:latest"
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENABLE_METRICS
              value: "true"
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backendrest
  namespace: mlops
  labels:
    app.kubernetes.io/name: backendrest
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: backendrest