        aistor.min.io/support: https://subnet.min.io
        aistor.min.io/version: RELEASE.2025-12-17T19-10-08Z
      labels:
        aistor.min.io/name: adminjob-operator
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: aistor.min.io/name
                operator: In
                values:
                - adminjob-operator
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - adminjob
        - -license
        - /tmp/license/minio.license
        env:
        - name: POD_NODENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: "quay.io/minio/aistor/operator:RELEASE.2025-12-17T19-10-08Z"
        name: controller
        resources:
          requests:
            cpu: 200m
            ephemeral-storage: 500Mi
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 1000
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp/license
          name: minio-license
      serviceAccountName: aistor-adminjob
      volumes:
      - name: minio-license
        secret:
          defaultMode: 444
          optional: true
          secretName: minio-license
